name: M3U Playlist Filter

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

env:
  M3U_SOURCE_URL: ${{ secrets.M3U_SOURCE_URL }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME  }}
  S3_OBJECT_KEY: ${{ secrets.S3_OBJECT_KEY }}
  S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
  S3_REGION: ${{ secrets.S3_REGION }}
  S3_EPG_KEY: ${{ secrets.S3_EPG_KEY }}
  EPG_SOURCE_URL: ${{ secrets.EPG_SOURCE_URL }}
  LOCAL_EPG_PATH: ${{ secrets.LOCAL_EPG_PATH  }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Build
      run: go build -o /dev/null ./...

    - name: Vet
      run: go vet ./...

    - name: Run tests
      run: go test ./... -v -count=1

  filter-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: github.event_name != 'pull_request' || always()
    permissions:
      contents: read
    # Эти переменные нужны только этому job'у — не кладём их в общий env,
    # чтобы не ломать TestProbeConfigDefaults в test job (он ждёт default=false).
    env:
      CATEGORIES_FILE_PATH: categories.txt
      # Telegram-отчёт по итогам прогона (нужен только этому job'у; без этих
      # переменных отчёт не отправляется вообще).
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Опрос доступности источников (HEAD+GET Range). В dry-run (PR) probe пропускается.
      PROBE_SOURCES: "true"
      # Ускорение пробы: 100 параллельных запросов (было 20) и таймаут 4 с (было 5 с) —
      # мёртвый URL стоит 8 с вместо 10 с, вся проба ~2600 URL занимает ~3-4 мин вместо ~15 мин.
      PROBE_CONCURRENCY: "100"
      PROBE_TIMEOUT_SECONDS: "4"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Build binary
      run: go build -o iptv-filter ./cmd/iptv-filter/

    - name: Set dry-run mode for pull requests
      if: github.event_name == 'pull_request'
      run: echo "DRY_RUN=true" >> $GITHUB_ENV

    - name: Run M3U filter script
      run: ./iptv-filter


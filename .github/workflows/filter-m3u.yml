name: M3U Playlist Filter

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Test (race detector)
      # Single full pass under -race: the race build is a strict superset of a
      # plain test run (same tests, with data-race checking), so running both
      # would just double CI time (~80 s + ~106 s → ~106 s total).
      run: go test -race ./... -v -count=1

  filter-m3u:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # On pull requests this job is a pure dry-run (no secrets, no S3 upload,
    # no Telegram report), so it runs in parallel with the test job instead of
    # waiting for it — MR feedback drops by ~3 min. On push/schedule it still
    # gates on tests passing via needs.
    needs: ${{ github.event_name == 'pull_request' && [] || ['test'] }}
    # Run only when tests pass (default success() gate). PRs execute a dry-run
    # (DRY_RUN is set in a step below); pushes/schedule run the real filter.
    permissions:
      contents: read
    # Источники и хранилище: job-scoped, чтобы test job их не видел.
    env:
      M3U_SOURCE_URL: ${{ secrets.M3U_SOURCE_URL }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      S3_OBJECT_KEY: ${{ secrets.S3_OBJECT_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_EPG_KEY: ${{ secrets.S3_EPG_KEY }}
      EPG_SOURCE_URL: ${{ secrets.EPG_SOURCE_URL }}
      LOCAL_EPG_PATH: ${{ secrets.LOCAL_EPG_PATH }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Metadata overrides для категорий.
      CATEGORIES_FILE_PATH: categories.txt
      # Telegram-отчёт по итогам прогона.
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Опрос доступности источников (HEAD+GET Range). В dry-run (PR) probe пропускается.
      PROBE_SOURCES: "true"
      # Ускорение пробы: 100 параллельных запросов (было 20) и таймаут 4 с (было 5 с) —
      # мёртвый URL стоит 8 с вместо 10 с, вся проба ~2600 URL занимает ~3-4 мин вместо ~15 мин.
      PROBE_CONCURRENCY: "100"
      PROBE_TIMEOUT_SECONDS: "4"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Build binary
      run: go build -o iptv-filter ./cmd/iptv-filter/

    - name: Set dry-run mode for pull requests
      if: github.event_name == 'pull_request'
      run: echo "DRY_RUN=true" >> $GITHUB_ENV

    - name: Run M3U filter script
      run: ./iptv-filter


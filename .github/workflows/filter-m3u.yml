name: M3U Playlist Filter

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    # Пин к ubuntu-24.04: ubuntu-latest мигрирует на Ubuntu 26.04 с 19.10.2026
    # (actions/runner-images#14748), что меняет набор предустановленных тулов.
    # Переход на 26.04 — отдельное осознанное изменение.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Test (race detector)
      # Single full pass under -race: the race build is a strict superset of a
      # plain test run (same tests, with data-race checking), so running both
      # would just double CI time (~80 s + ~106 s → ~106 s total).
      run: go test -race ./... -v -count=1

  filter-m3u:
    # Real filter run (with secrets + upload) only on push/schedule; PRs use
    # the parallel dry-run job at the bottom instead.
    if: github.event_name != 'pull_request'
    # Пин к ubuntu-24.04: ubuntu-latest мигрирует на Ubuntu 26.04 с 19.10.2026
    # (actions/runner-images#14748), что меняет набор предустановленных тулов.
    # Переход на 26.04 — отдельное осознанное изменение.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Run only when tests pass (default success() gate).
    needs: test
    permissions:
      contents: read
    # Источники и хранилище: job-scoped, чтобы test job их не видел.
    env:
      M3U_SOURCE_URL: ${{ secrets.M3U_SOURCE_URL }}
      S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
      S3_OBJECT_KEY: ${{ secrets.S3_OBJECT_KEY }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_EPG_KEY: ${{ secrets.S3_EPG_KEY }}
      EPG_SOURCE_URL: ${{ secrets.EPG_SOURCE_URL }}
      LOCAL_EPG_PATH: ${{ secrets.LOCAL_EPG_PATH }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Metadata overrides для категорий.
      CATEGORIES_FILE_PATH: categories.txt
      # Telegram-отчёт по итогам прогона.
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      # Опрос доступности источников (HEAD+GET Range). В dry-run (PR) probe пропускается.
      PROBE_SOURCES: "true"
      # Ускорение пробы: 100 параллельных запросов (было 20) и таймаут 4 с (было 5 с) —
      # мёртвый URL стоит 8 с вместо 10 с, вся проба ~2600 URL занимает ~3-4 мин вместо ~15 мин.
      PROBE_CONCURRENCY: "100"
      PROBE_TIMEOUT_SECONDS: "4"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Build binary
      run: go build -o iptv-filter ./cmd/iptv-filter/

    - name: Run M3U filter script
      run: ./iptv-filter


  # PR-only dry-run: runs the filter in parallel with the test job (no needs
  # gate) for fast MR feedback. PR runs have no access to secrets, so the
  # pipeline needs a real M3U source — the public iptv-org demo playlist is
  # used, and DRY_RUN keeps everything local (no S3, no Telegram report).
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Build binary
      run: go build -o iptv-filter ./cmd/iptv-filter/

    - name: Run M3U filter script (dry-run)
      env:
        DRY_RUN: "true"
        OUTPUT_DIR: output
        # No secrets on pull_request events: use a public demo playlist so the
        # full pipeline (download → filter → save) still gets exercised.
        M3U_SOURCE_URL: "https://iptv-org.github.io/iptv/index.m3u"
      run: ./iptv-filter
